# Check the gamedb tools: the builder crate and the Python lint it is held to.
#
# The data set itself lives in its own repository (gamebus-gamedb) and gates
# its own pull requests there, with the gamedb-lint binary this repository
# publishes. What is checked here is the tooling: the Rust lint against the
# fixture set, the builder's own tests, and that the daemon has gained none of
# the builder's dependencies.

name: gamedb Tools

on:
  pull_request:
    paths:
      - "gamedb-build/**"
      - ".scripts/gamedb-lint*"
      - ".gitmodules"
      - ".github/workflows/gamedb-tools.yml"

permissions: {}

concurrency:
  group: gamedb-tools-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # default-members = ["."] keeps the daemon's own cargo commands unchanged,
  # which also means a root `cargo test` never reaches this crate. It has to
  # be named, or its tests run nowhere.
  tools:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # The builder's tests read the real pages through the gamedb submodule.
      - uses: actions/checkout@v4
        with:
          submodules: true

      # tomllib needs 3.11+; the Python lint imports nothing else.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The Python lint is the reference the Rust lint is held to, so it has
      # to keep passing its own self-test here.
      - name: Python lint self-test
        run: .scripts/gamedb-lint-selftest.sh

      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: gamedb-build-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain') }}
          restore-keys: |
            gamedb-build-${{ runner.os }}-

      # The Rust lint is held to the Python lint's fixture set byte for byte,
      # so this is also what stops the two implementations drifting apart.
      - name: Gate
        run: |
          cargo fmt --all --check
          cargo clippy -p gamedb-build --all-targets --all-features -- -D warnings
          cargo test -p gamedb-build

      # The daemon must gain nothing from any of this.
      - name: The daemon's tree stays clean
        run: |
          set -eu
          if cargo tree -p gamebus-presenced | grep -qiE "arrow|parquet|rusqlite|libsqlite"; then
            echo "::error::the daemon's dependency tree has picked up a builder dependency"
            cargo tree -p gamebus-presenced | grep -iE "arrow|parquet|rusqlite|libsqlite"
            exit 1
          fi
