# Build the gamedb artifacts and publish them as release assets.
#
# The built forms are never committed: a binary blob per merge bloats the
# repository permanently, and the TOML pages are the source of truth, so the
# artifacts are always reproducible from a commit. They therefore exist only
# here, as assets hanging off a tag.
#
# Tag namespace is `gamedb-v*`, separate from the daemon's own `v*` tags in
# release.yml, so a data release and a daemon release never collide.
#
# A manual run builds and verifies without publishing, which is how you check
# a build before cutting a tag. Give it a tag name to attach the artifacts to
# an existing release instead.
#
# The builder is a pure-Rust workspace member plus bundled C. No system
# package is installed - not DuckDB, not anything else.

name: gamedb Release

on:
  push:
    tags: ["gamedb-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to upload the artifacts to. Leave empty to build and verify only."
        required: false
        default: ""

permissions: {}

concurrency:
  group: gamedb-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # rustup picks up the repo's rust-toolchain pin (channel + components).
      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install

      # Only the compiler's own inputs and outputs are cached. `build/` is
      # deliberately absent: a cached artifact directory would let a build
      # that produced nothing look like one that succeeded.
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: gamedb-release-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain') }}
          restore-keys: |
            gamedb-release-${{ runner.os }}-

      # Artifacts are built from the data set, so the data set is validated
      # first. Publishing a condensed form of data that does not pass the
      # merge gate would ship a contradiction.
      - name: Gate
        run: |
          chmod +x .scripts/gamedb-lint.py .scripts/gamedb-lint-selftest.sh
          .scripts/gamedb-lint.py gamedb
          .scripts/gamedb-lint-selftest.sh

      # Removed rather than overwritten, so nothing left over from a restored
      # cache or an earlier step can stand in for output the builder did not
      # actually write.
      - name: Build
        run: |
          set -eu
          rm -rf build
          cargo run -p gamedb-build -- --data gamedb --out build/ --commit "$GITHUB_SHA"

      - name: Verify
        run: |
          set -eu
          missing=0
          for f in identities.json identities.parquet identities.sqlite \
                   shared-helpers.txt manifest.toml; do
            if [ ! -s "build/$f" ]; then
              echo "::error::the builder did not produce build/$f, or produced it empty"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

          # The artifacts live only in the release. If one is ever tracked,
          # the repository has started carrying build output.
          tracked=$(git ls-files -- build)
          if [ -n "$tracked" ]; then
            echo "::error::build output is tracked in git and must not be: $tracked"
            exit 1
          fi

          {
            echo "## gamedb artifacts"
            echo
            echo "Built from \`$GITHUB_SHA\`."
            echo
            echo '```'
            (cd build && sha256sum ./*)
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: gamedb-artifacts
          path: build/
          if-no-files-found: error
          retention-days: 14

  # Split from the build so that write access to the repository exists only
  # in the step that actually needs it.
  publish:
    needs: build
    if: ${{ github.event_name == 'push' || inputs.tag != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: gamedb-artifacts
          path: build

      # A tag push cuts the release; a manual run with a tag attaches to one
      # that already exists, replacing assets of the same name.
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          set -eu
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              build/identities.json \
              build/identities.parquet \
              build/identities.sqlite \
              build/shared-helpers.txt \
              build/manifest.toml
          else
            gh release upload "$TAG" --clobber \
              build/identities.json \
              build/identities.parquet \
              build/identities.sqlite \
              build/shared-helpers.txt \
              build/manifest.toml
          fi
