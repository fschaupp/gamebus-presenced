[package]
name = "gamedb-build"
version = "0.2.0"
edition = "2021"
authors = ["fschaupp <spritzwine.absently488@passinbox.com>"]
description = "Lint the gamedb data set and build its published artifacts"
license = "MIT OR Apache-2.0"
publish = false
default-run = "gamedb-build"

[[bin]]
name = "gamedb-build"
path = "src/bin/gamedb-build.rs"

[[bin]]
name = "gamedb-lint"
path = "src/bin/gamedb-lint.rs"

[dependencies]
# Pure Rust or bundled C only: a clean machine builds every artifact with
# cargo alone, no system package and no DuckDB.
parquet = { version = "56", default-features = false, features = ["arrow", "zstd"] }
arrow-array = "56"
arrow-schema = "56"
arrow-buffer = "56"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = { version = "0.8", features = ["preserve_order"] }
regex = "1"
sha2 = "0.10"
